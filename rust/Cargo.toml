[workspace]
members = ["dss-sys", "dss", "dss-cli", "dss-server"]
resolver = "3"

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.99"
license = "LGPL-2.1-or-later"
repository = "https://github.com/codingducksrl/dss-rust"
publish = false

[workspace.dependencies]
dss-sys = { path = "dss-sys" }
dss = { path = "dss" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
clap = { version = "4.6.7", features = ["derive", "env"] }
bindgen = "0.73.2"
# Digests and certificates travel as base64 in the JSON. Scalar engine only: the inputs are a few KB.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
# dss-server only. HTTP/1.1 is all a sidecar on the same host or network needs.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "multipart"] }
tower = { version = "0.5.3", default-features = false }
http-body-util = "0.1.5"
