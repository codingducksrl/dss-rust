# Applied whenever this jar is on a native-image class path (the shared library and the native tests).
#   DssFeature        families of reflection/resources; see docs/reflection-audit.md
#   user.language/country
#                     the builder's default locale is the one whose data goes into the image; pin it to en-US
#                     whatever the build machine uses. The library pins Locale.US at isolate start
#                     (RuntimeDefaults), so the host's locale is never used. -H:+IncludeAllLocales would add
#                     ~50 MB instead. (-H:DefaultLocale is deprecated and ignored in GraalVM 25.)
# (http/https URL handlers are in reachability-metadata.json; --enable-url-protocols is deprecated.)
#   AddAllCharsets    the JDK's full charset set, as on a JVM. Without it Charset.forName("Windows-1252") fails
#                     and PDFBox's parser silently falls back to ISO-8859-1 for undecodable PDF names (found by
#                     scripts/diff-vs-jvm.sh). XML or text in other encodings would fail the same way.
#   CheckIsolateThreadAtEntry
#                     every dss_* call verifies that the graal_isolatethread_t* it was given belongs to the calling
#                     OS thread and is still attached. Without it a handle used from another thread, or after
#                     graal_detach_thread, is silently accepted and corrupts the isolate; with it the process stops
#                     with a fatal error that names the mistake (docs/native-library.md, "Rules"). The check is a
#                     thread-id comparison and a pointer compare per call. Experimental in GraalVM 25, hence the
#                     unlock/lock pair.
#   AdditionalSecurityProviders
#                     BouncyCastle is registered as a JCA provider by the engine at run time (DSS needs it), and
#                     the JDK's TLS stack may pick its services. From GraalVM 25.5 the image verifies at run time
#                     that any provider the security stack uses was registered at build time; without this line
#                     every TLS handshake fails with "Attempted to verify a provider that was not registered at
#                     build time: org.bouncycastle.jce.provider.BouncyCastleProvider" (the v0.6.0 CI run). DssFeature
#                     registers the provider's classes for reflection; this registers the provider itself. The
#                     option is experimental in GraalVM 25, so it sits inside the unlock/lock pair.
Args = --features=it.codingduck.dssnative.nativeimage.DssFeature \
       -Duser.language=en -Duser.country=US \
       -H:+AddAllCharsets \
       -H:+UnlockExperimentalVMOptions \
       -H:AdditionalSecurityProviders=org.bouncycastle.jce.provider.BouncyCastleProvider \
       -H:+CheckIsolateThreadAtEntry \
       -H:-UnlockExperimentalVMOptions
