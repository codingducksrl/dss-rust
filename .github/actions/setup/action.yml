name: Set up dss-native build
description: GraalVM CE (pinned, checksum-verified), Rust toolchain, libclang, and caches for Maven and Cargo.
inputs:
  platform:
    description: linux-x64, linux-aarch64 or macos-aarch64
    required: true
  release:
    description: >-
      true for a release build: the Maven repository is restored only from an exact cache hit (same pom), never
      from an older cache by prefix
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Only the downloaded tarball is cached; install-graalvm.sh checks its SHA-256 on every run and extracts it
    # afresh. The key hashes the script, so changing the pin there changes the key.
    - name: Cache GraalVM CE download
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/graalvm/download
        key: graalvm-ce-${{ inputs.platform }}-${{ hashFiles('scripts/ci/install-graalvm.sh') }}

    # Assigned first, then written: inside `echo "...$(...)"` the script's exit status would be lost and an
    # empty JAVA_HOME exported.
    - name: Install GraalVM CE
      shell: bash
      run: |
        home="$(scripts/ci/install-graalvm.sh "$HOME/graalvm")"
        [[ -n "$home" && -x "$home/bin/native-image" ]] || { echo "::error::GraalVM CE installation failed"; exit 1; }
        echo "JAVA_HOME=$home" >> "$GITHUB_ENV"

    # build-essential, zlib1g-dev: native-image's documented Linux prerequisites (it links with -lz).
    # libclang-dev: bindgen (dss-sys). unzip: without it the Maven wrapper fetches the .tar.gz distribution,
    # whose checksum differs from the pinned .zip one, and fails.
    - name: Native toolchain packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends build-essential zlib1g-dev libclang-dev unzip

    - name: Rust toolchain (rust/rust-toolchain.toml)
      shell: bash
      working-directory: rust
      run: |
        channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
        rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
        rustc --version

    - name: Cache Maven repository
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: maven-${{ inputs.platform }}-${{ hashFiles('java/pom.xml', 'java/.mvn/maven.config', 'java/.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: ${{ inputs.release != 'true' && format('maven-{0}-', inputs.platform) || '' }}

    - name: Cache Cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ inputs.platform }}-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: cargo-${{ inputs.platform }}-
