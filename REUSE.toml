# SPDX-FileCopyrightText: 2026 Coding Duck
# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Licensing of the files that cannot carry an SPDX header (REUSE specification 3.3, https://reuse.software).
# Every other file has its own `SPDX-FileCopyrightText` / `SPDX-License-Identifier` header. scripts/ci/check-repo.py
# fails in CI when a file has neither a header nor an annotation here.
version = 1

# Manifests, lock files, configuration, generated metadata and documentation of the project itself.
[[annotations]]
path = [
    ".gitattributes",
    ".gitignore",
    "README.md",
    "docs/**",
    "java/.mvn/maven.config",
    "java/.mvn/wrapper/maven-wrapper.properties",
    "java/src/main/resources-filtered/**",
    "java/src/main/resources/META-INF/native-image/**",
    "java/src/test/resources/META-INF/**",
    "php/**",
    "rust/Cargo.lock",
    "rust/Cargo.toml",
    "rust/*/Cargo.toml",
    "rust/rust-toolchain.toml",
    "rust/rustfmt.toml",
    "scripts/agent/**",
    "testdata/private/README.md",
    "trust/README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Coding Duck"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Synthetic test documents and the throw-away test PKI, generated by scripts/generate-fixtures.sh.
[[annotations]]
path = "testdata/fixtures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Coding Duck"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Visible-signature test outputs that the first commit included by mistake (they are build output, now ignored
# by .gitignore's /target/). To be dropped from the index with `git rm -r --cached target/`, then this entry.
[[annotations]]
path = "target/visible/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Coding Duck"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# The audit report and its post-remediation status view: generated HTML, no header of their own.
[[annotations]]
path = ["audit.html", "audit-2.html"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Coding Duck"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# The OJ keystore, copied unchanged from the DSS demonstrations 6.5.1 (trust/README.md).
[[annotations]]
path = "trust/oj-keystore.p12"
precedence = "override"
SPDX-FileCopyrightText = "2015 European Commission"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Apache Maven Wrapper 3.3.4.
[[annotations]]
path = ["java/mvnw", "java/mvnw.cmd"]
precedence = "override"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

# Notices of third-party components compiled into the library: each reproduces its component's licence.
[[annotations]]
path = "third-party/dss.txt"
precedence = "override"
SPDX-FileCopyrightText = "2015 European Commission"
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = "third-party/pt-serif.txt"
precedence = "override"
SPDX-FileCopyrightText = "2010 ParaType Ltd."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "third-party/stax2-api.txt"
precedence = "override"
SPDX-FileCopyrightText = "2010 FasterXML.com"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = "third-party/woodstox.txt"
precedence = "override"
SPDX-FileCopyrightText = "2004 Tatu Saloranta"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "third-party/public-suffix-list.txt"
precedence = "override"
SPDX-FileCopyrightText = "Mozilla Foundation and Public Suffix List contributors"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "third-party/xmldsig-core-schema.txt"
precedence = "override"
SPDX-FileCopyrightText = "2001 The Internet Society and W3C"
SPDX-License-Identifier = "W3C-19980720"

[[annotations]]
path = "third-party/graalvm-sdk.txt"
precedence = "override"
SPDX-FileCopyrightText = "2019, 2025 Oracle and/or its affiliates"
SPDX-License-Identifier = "UPL-1.0"
